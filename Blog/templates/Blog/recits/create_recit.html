<!-- templates/create_ticket.html -->

<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un récit</title>
    <link rel="icon" type="image/x-icon" href="/media/86_icon.svg">
    <link rel="stylesheet" href="{% static 'fontawesome/css/all.min.css' %}">
    <link rel="stylesheet" href="{% static 'Blog/css/style.css' %}">
    <link rel="stylesheet" href="{% static 'Blog/recits/css/create_recit.css' %}">

    
    {% include "Blog/layout/base.html" %}



</head>
<body>

    <div class="block">
        <h1>Initiation du récit</h1>
        <br><br>
        Nommez votre récit !
        <br><br>

        <form method="post" class="recit-form">
            {% csrf_token %}
            {{ form.message }}
            <br><br>
            <button type="submit">Envoyer</button>
        </form>
    </div>  

    <div class="bottom">
        <a href="/recits/" style="margin: 20px;"><i class="fa-solid fa-chevron-left"></i>Retourner à la liste des récits</a>
    </div>
</body>
</html>
